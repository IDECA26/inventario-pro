<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Pro</title>
    <link rel="stylesheet" href="style.css">
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen" class="screen">
        <div class="login-card">
            <h2>Inventario Pro</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required autocomplete="current-password">
                </div>
                <button type="submit" id="login-btn" class="btn-primary">Ingresar</button>
                <div id="login-alert" class="alert hidden"></div>
            </form>
        </div>
    </div>

    <!-- PANTALLA PRINCIPAL / DASHBOARD -->
    <div id="dashboard-screen" class="screen hidden" style="display: none;">
        <header class="top-bar">
            <div class="user-info">
                <span id="user-display-name">Usuario</span>
            </div>
            <button id="logout-btn" class="btn-secondary">Salir</button>
        </header>

        <main class="main-container">
            <div class="search-bar-container">
                <input type="text" id="search-input" placeholder="Buscar por nombre o código..." autocomplete="off">
                <button id="scan-btn" class="btn-icon">📷 QR</button>
            </div>

            <div id="loading-indicator" class="loading hidden">Cargando productos...</div>

            <!-- Contenedor donde se listarán los productos de forma visual -->
            <div id="product-list" class="product-grid">
                <!-- Los productos se inyectarán aquí automáticamente -->
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
