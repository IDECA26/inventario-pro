<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Pro</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
</head>
<body>
    <!-- Pantalla de Login -->
    <div id="login-screen">
        <div class="login-card">
            <h1>Inventario Pro</h1>
            <div id="login-alert" class="alert alert-error hidden"></div>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Contrasena</label>
                    <input type="password" id="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn" id="login-btn">Iniciar Sesion</button>
            </form>
        </div>
    </div>

    <!-- Panel Principal -->
    <div id="dashboard-screen" class="hidden">
        <header>
            <div class="user-info"><span id="user-display-name">Cargando...</span></div>
            <button class="btn btn-logout" id="logout-btn">Salir</button>
        </header>
        <div class="container">
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Buscar por nombre, codigo o escanear...">
                <button class="btn btn-scan" id="scan-btn">
                    <span class="material-icons-round">qr_code_scanner</span>
                </button>
            </div>
            <div id="loading-indicator" class="loading hidden">Cargando productos...</div>
            <div id="product-list" class="product-list"></div>
        </div>
    </div>

    <!-- SDK Oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
