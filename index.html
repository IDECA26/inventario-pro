<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Navegacion superior -->
        <header class="main-header">
            <h1>Inventario Pro</h1>
            <nav id="main-nav">
                <!-- Los botones de navegacion se generan dinamicamente segun el rol -->
            </nav>
        </header>

        <main>
            <!-- PESTAÑA: INGRESO DE MERCANCIA -->
            <section id="tab-ingress" class="tab-content">
                <h2>Ingreso de Mercancía</h2>
                <form id="ingress-form">
                    <div class="form-group" style="position: relative;">
                        <label>Código de Barras o Código Manual</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="ingress-code" required placeholder="Escanee o escriba el código o nombre..." autocomplete="off">
                            <button type="button" id="scan-ingress-btn" class="btn-secondary">Cámara</button>
                            <button type="button" id="search-master-btn" class="btn-secondary">Buscar</button>
                        </div>
                        <!-- Contenedor flotante para sugerencias dinámicas de ingreso -->
                        <div id="ingress-suggestions" class="autocomplete-suggestions hidden"></div>
                    </div>

                    <div class="form-group">
                        <label>Nombre del Producto</label>
                        <input type="text" id="ingress-name" required placeholder="Nombre descriptivo del producto">
                    </div>

                    <div class="form-group">
                        <label>Precio de Venta ($)</label>
                        <input type="number" step="0.01" id="ingress-price" required placeholder="0.00">
                    </div>

                    <fieldset class="form-group">
                        <legend>Factores de Empaque (Conversión)</legend>
                        <div style="display: flex; gap: 10px;">
                            <div>
                                <label>Unid. por Caja</label>
                                <input type="number" id="factor-box" value="1" min="1">
                            </div>
                            <div>
                                <label>Unid. por Paquete</label>
                                <input type="number" id="factor-pack" value="1" min="1">
                            </div>
                            <div>
                                <label>Unid. por Bulto</label>
                                <input type="number" id="factor-bale" value="1" min="1">
                            </div>
                        </div>
                    </fieldset>

                    <div class="form-group">
                        <label>Unidad de Ingreso</label>
                        <select id="packaging-unit">
                            <option value="unidad">Unidades Sueltas</option>
                            <option value="caja">Cajas</option>
                            <option value="paquete">Paquetes</option>
                            <option value="bulto">Bultos / Pacas</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Cantidad a Ingresar</label>
                        <input type="number" step="any" id="ingress-quantity" required placeholder="Cantidad en la unidad seleccionada">
                    </div>

                    <button type="submit" class="btn-primary">Registrar Ingreso</button>
                </form>
            </section>

            <!-- PESTAÑA: EGRESOS / DESPACHOS -->
            <section id="tab-egress" class="tab-content" style="display: none;">
                <h2>Egreso / Despacho de Mercancía</h2>
                <form id="egress-form">
                    <div class="form-group" style="position: relative;">
                        <label>Código del Producto o Escanear</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="egress-code" required placeholder="Escanee o escriba el código o nombre..." autocomplete="off">
                            <button type="button" id="scan-egress-btn" class="btn-secondary">Cámara</button>
                            <input type="file" id="camera-input-egress" accept="image/*" capture="environment" style="display: none;">
                            <button type="button" id="search-egress-prod-btn" class="btn-secondary">Buscar</button>
                        </div>
                        <!-- Contenedor flotante para sugerencias dinámicas de egreso -->
                        <div id="egress-suggestions" class="autocomplete-suggestions hidden"></div>
                    </div>

                    <div class="form-group">
                        <label>Nombre del Producto</label>
                        <input type="text" id="egress-product-name" readonly placeholder="Se cargará automáticamente">
                    </div>

                    <div class="form-group">
                        <label>Stock Actual Disponible</label>
                        <input type="text" id="egress-current-stock" readonly value="0">
                    </div>

                    <div class="form-group">
                        <label>Cantidad a Egresar (Unidades)</label>
                        <input type="number" step="any" id="egress-quantity" required placeholder="Cantidad de unidades">
                    </div>

                    <button type="submit" class="btn-primary">Procesar Egreso</button>
                </form>
            </section>
        </main>
    </div>

    <!-- Scripts externos y de la aplicación -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="roles.js"></script>
    <script src="offline-sync.js"></script>
    <script src="app.js"></script>
    <script src="egresos.js"></script>
    <script src="estadisticas.js"></script>
    <script src="tenant-stats.js"></script>
</body>
</html>
